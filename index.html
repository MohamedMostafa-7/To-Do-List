<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="./assets/plugins/fontawesome/css/all.min.css">
    <!-- Google Fonts -->
    <!-- Main CSS -->
    <link rel="stylesheet" href="./assets/src/css/style.css">
</head>

<body>
    <h1>To Do List</h1>
    <div class="taskContainer">
        <div class="taskList">
            <i class="fa-solid fa-star icon-star"></i>
            <p class="">Task 1</p>
            <div>
                <i class="fa-solid fa-trash icon-trash"></i>
                <i class="fa-solid fa-pen-to-square icon-edit"></i>
                <i class="fa-regular fa-circle-check icon-check"></i>
            </div>
        </div>
        <div class="taskList">
            <i class="fa-solid fa-star icon-star"></i>
            <p class="">Task 2</p>
            <div>
                <i class="fa-solid fa-trash icon-trash"></i>
                <i class="fa-solid fa-pen-to-square icon-edit"></i>
                <i class="fa-regular fa-circle-check icon-check"></i>
            </div>
        </div>

    </div>
    <h2>Add New Task</h2>
    <form action="">
        <input id="inputTask" type="text" placeholder="Add Task" name="taskName" value="">
        <button id="upload" class="addTask"><i class="fa-solid fa-diagram-next"></i></button>
    </form>

    <!-- Main JS -->
    <script src="./assets/src/js/index.js"></script>
</body>

</html>
